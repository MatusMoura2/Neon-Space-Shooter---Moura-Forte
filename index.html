<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moura Forte - Neon Space Shooter</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');
        
        body { margin: 0; overflow: hidden; background-color: #050510; color: white; font-family: 'Orbitron', sans-serif; }
        canvas { display: block; width: 100vw; height: 100vh; }
        
        .intro-screen {
            position: fixed; inset: 0; background-color: #000;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 50; animation: introReveal 3.5s forwards;
        }
        .logo-text { font-size: 3rem; font-weight: 900; text-align: center; color: #00ffff; text-shadow: 0 0 20px #00ffff; }
        .logo-sub { font-size: 1.5rem; color: #ff00ff; text-shadow: 0 0 10px #ff00ff; margin-top: 10px; }
        
        @keyframes introReveal {
            0% { opacity: 0; filter: blur(20px); transform: scale(0.8); }
            10% { opacity: 1; filter: blur(0px); transform: scale(1); }
            85% { opacity: 1; filter: blur(0px); transform: scale(1.05); }
            100% { opacity: 0; filter: blur(20px); transform: scale(1.2); visibility: hidden; }
        }

        .hud-text { text-shadow: 0 0 5px currentColor; }
        .phase-alert {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-size: 4rem; font-weight: bold; color: #ffeb3b; text-shadow: 0 0 30px #ffeb3b;
            z-index: 20; pointer-events: none; opacity: 0; transition: opacity 0.3s;
        }
        .phase-alert.show { opacity: 1; animation: pulsePhase 2s forwards; }
        
        @keyframes pulsePhase {
            0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0; }
            20% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
            80% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(1.5); opacity: 0; }
        }
    </style>
</head>
<body>
    <div id="intro" class="intro-screen">
        <div class="logo-text">MOURA FORTE</div>
        <div class="logo-sub">TECNOLOGIA</div>
    </div>

    <div id="menu" class="fixed inset-0 flex flex-col items-center justify-center bg-black/80 z-30 hidden backdrop-blur-sm">
        <h1 class="text-6xl font-black text-cyan-400 mb-4 drop-shadow-[0_0_15px_rgba(34,211,238,1)] text-center">NEON SHOOTER</h1>
        <p class="text-xl text-fuchsia-400 mb-8 drop-shadow-[0_0_10px_rgba(232,121,249,1)]">Destrua inimigos. Evolua. Sobreviva.</p>
        <div class="text-gray-300 mb-8 text-center text-sm space-y-2">
            <p>Controles: Arraste com o mouse / toque</p>
            <p>Deixar passar: -0.5 Vidas | Colidir: -1 Vida</p>
        </div>
        <button id="startBtn" class="px-8 py-4 bg-cyan-600 hover:bg-cyan-500 text-white font-bold rounded-lg text-2xl transition-all shadow-[0_0_20px_rgba(34,211,238,0.5)] hover:shadow-[0_0_30px_rgba(34,211,238,0.8)] border border-cyan-400">
            INICIAR JOGO
        </button>
    </div>

    <div id="gameOver" class="fixed inset-0 flex flex-col items-center justify-center bg-black/90 z-40 hidden">
        <h2 class="text-5xl font-bold text-red-500 mb-4 drop-shadow-[0_0_20px_rgba(239,68,68,1)]">GAME OVER</h2>
        <p class="text-2xl text-white mb-2">Pontuação: <span id="finalScore" class="text-cyan-400">0</span></p>
        <p class="text-xl text-gray-400 mb-8">Fase alcançada: <span id="finalPhase" class="text-fuchsia-400">1</span></p>
        <button id="restartBtn" class="px-6 py-3 bg-fuchsia-600 hover:bg-fuchsia-500 text-white font-bold rounded text-xl transition-all shadow-[0_0_15px_rgba(232,121,249,0.5)]">
            TENTAR NOVAMENTE
        </button>
    </div>

    <div id="hud" class="fixed top-0 left-0 w-full p-4 flex justify-between items-start z-10 pointer-events-none hidden">
        <div>
            <div class="text-cyan-400 text-2xl font-bold hud-text">SCORE: <span id="scoreUI">0</span></div>
            <div class="text-fuchsia-400 text-xl hud-text mt-1">FASE: <span id="phaseUI">1</span></div>
        </div>
        <div class="text-right">
            <div class="text-red-400 text-2xl font-bold hud-text">♥ <span id="livesUI">5.0</span></div>
            <div class="text-green-400 text-lg hud-text mt-1">POWER: NV <span id="powerUI">1</span></div>
        </div>
    </div>

    <div id="phaseAlert" class="phase-alert">FASE 2</div>

    <canvas id="gameCanvas"></canvas>

    <script>
        // --- AUDIO ENGINE (Web Audio API) ---
        // 100% Procedural, 0 bytes of external files, Zero copyright issues.
        let audioCtx;
        let masterGain;
        let bgmInterval;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                masterGain = audioCtx.createGain();
                masterGain.gain.value = 0.3; // Volume geral suave
                masterGain.connect(audioCtx.destination);
            }
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playTone(freq, type, duration, vol = 1, slideTo = null) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            if(slideTo) {
                osc.frequency.exponentialRampToValueAtTime(slideTo, audioCtx.currentTime + duration);
            }
            
            gain.gain.setValueAtTime(vol, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
            
            osc.connect(gain);
            gain.connect(masterGain);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        function sfxShoot() { playTone(600, 'square', 0.1, 0.1, 300); }
        function sfxExplosion() { playTone(100, 'sawtooth', 0.3, 0.4, 40); }
        function sfxPowerup() { 
            playTone(440, 'sine', 0.1, 0.5); 
            setTimeout(() => playTone(660, 'sine', 0.2, 0.5), 100); 
        }
        function sfxDamage() { playTone(150, 'sawtooth', 0.4, 0.8, 50); }
        function sfxPhaseUp() {
            playTone(400, 'square', 0.1, 0.4, 800);
            setTimeout(() => playTone(600, 'square', 0.3, 0.4, 1200), 100);
        }

        function startBGM() {
            if(bgmInterval) clearInterval(bgmInterval);
            // Synthwave bassline (A minor)
            const notes = [110, 110, 130.81, 146.83, 110, 110, 98, 110];
            let step = 0;
            bgmInterval = setInterval(() => {
                if (gameState !== 'playing') return;
                playTone(notes[step], 'triangle', 0.15, 0.2);
                step = (step + 1) % notes.length;
            }, 250);
        }
        // ------------------------------------

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        const intro = document.getElementById('intro');
        const menu = document.getElementById('menu');
        const hud = document.getElementById('hud');
        const gameOverScreen = document.getElementById('gameOver');
        const startBtn = document.getElementById('startBtn');
        const restartBtn = document.getElementById('restartBtn');
        const phaseAlert = document.getElementById('phaseAlert');
        
        const scoreUI = document.getElementById('scoreUI');
        const phaseUI = document.getElementById('phaseUI');
        const livesUI = document.getElementById('livesUI');
        const powerUI = document.getElementById('powerUI');
        const finalScoreUI = document.getElementById('finalScore');
        const finalPhaseUI = document.getElementById('finalPhase');

        let width, height;
        let lastTime = 0;
        let gameState = 'intro';
        let animationId;

        let score = 0;
        let phase = 1;
        let lives = 5.0;
        let firePower = 1;
        let isInvulnerable = false;
        let invulnerableTimer = 0;
        let enemySpeedMult = 1.0;
        let enemySpawnRate = 1500;
        let lastEnemySpawn = 0;
        let enemyHue = 280;
        let enemyShape = 0;

        let stars = [], bullets = [], enemies = [], particles = [], powerups = [];

        const player = { x: 0, y: 0, size: 20, speed: 400, color: '#00ffff', lastShot: 0, fireRate: 150, targetX: 0, targetY: 0 };

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            if(gameState !== 'playing') {
                player.x = width / 2;
                player.y = height - 100;
                player.targetX = player.x;
                player.targetY = player.y;
            }
        }
        window.addEventListener('resize', resize);
        resize();

        for(let i = 0; i < 100; i++) {
            stars.push({ x: Math.random() * width, y: Math.random() * height, size: Math.random() * 2 + 0.5, speed: Math.random() * 50 + 20 });
        }

        let isDragging = false;
        function updateTarget(e) {
            if(gameState !== 'playing') return;
            let clientX = e.touches ? e.touches[0].clientX : e.clientX;
            let clientY = e.touches ? e.touches[0].clientY : e.clientY;
            player.targetX = clientX;
            player.targetY = clientY - 40;
        }
        
        window.addEventListener('mousedown', (e) => { isDragging = true; updateTarget(e); });
        window.addEventListener('mousemove', (e) => { if(isDragging) updateTarget(e); });
        window.addEventListener('mouseup', () => { isDragging = false; });
        window.addEventListener('touchstart', (e) => { updateTarget(e); }, {passive: false});
        window.addEventListener('touchmove', (e) => { updateTarget(e); }, {passive: false});

        function resetGame() {
            score = 0; phase = 1; lives = 5.0; firePower = 1;
            enemySpeedMult = 1.0; enemySpawnRate = 1200; enemyHue = 300; enemyShape = 0;
            bullets = []; enemies = []; particles = []; powerups = [];
            player.x = width / 2; player.y = height - 100; player.targetX = player.x; player.targetY = player.y;
            updateHUD();
        }

        function startGame() {
            initAudio();
            startBGM();
            gameState = 'playing';
            menu.classList.add('hidden');
            gameOverScreen.classList.add('hidden');
            hud.classList.remove('hidden');
            resetGame();
            lastTime = performance.now();
            lastEnemySpawn = lastTime;
            setInvulnerable(1500);
        }

        function setInvulnerable(timeMs) { isInvulnerable = true; invulnerableTimer = timeMs; }

        function advancePhase() {
            phase++;
            phaseAlert.innerText = "FASE " + phase;
            phaseAlert.classList.add('show');
            setTimeout(() => phaseAlert.classList.remove('show'), 2000);
            
            enemySpeedMult += 0.2;
            enemySpawnRate = Math.max(400, enemySpawnRate - 150);
            enemyHue = Math.floor(Math.random() * 360);
            enemyShape = Math.floor(Math.random() * 3);
            
            sfxPhaseUp();
            setInvulnerable(1500);
            updateHUD();
        }

        function spawnEnemy(now) {
            if (now - lastEnemySpawn > enemySpawnRate) {
                let size = Math.random() * 20 + 20;
                enemies.push({
                    x: Math.random() * (width - size * 2) + size,
                    y: -size, size: size, hp: 1 + Math.floor(phase / 2),
                    speed: (Math.random() * 100 + 150) * enemySpeedMult,
                    shape: enemyShape, color: `hsl(${enemyHue}, 100%, 50%)`
                });
                lastEnemySpawn = now;
            }
        }

        function spawnPowerUp(x, y) { powerups.push({ x: x, y: y, size: 15, speed: 100 }); }

        function createExplosion(x, y, color) {
            for(let i=0; i<15; i++) {
                particles.push({
                    x: x, y: y, vx: (Math.random() - 0.5) * 300, vy: (Math.random() - 0.5) * 300,
                    life: 1.0, color: color
                });
            }
        }

        function shoot(now) {
            if(now - player.lastShot > player.fireRate) {
                player.lastShot = now;
                let bSpeed = -800;
                sfxShoot();
                
                if (firePower === 1) {
                    bullets.push({x: player.x, y: player.y - 20, vx: 0, vy: bSpeed});
                } else if (firePower === 2) {
                    bullets.push({x: player.x - 10, y: player.y - 10, vx: 0, vy: bSpeed});
                    bullets.push({x: player.x + 10, y: player.y - 10, vx: 0, vy: bSpeed});
                } else if (firePower === 3) {
                    bullets.push({x: player.x, y: player.y - 20, vx: 0, vy: bSpeed});
                    bullets.push({x: player.x - 10, y: player.y - 10, vx: -150, vy: bSpeed});
                    bullets.push({x: player.x + 10, y: player.y - 10, vx: 150, vy: bSpeed});
                } else {
                    bullets.push({x: player.x - 15, y: player.y - 10, vx: -250, vy: bSpeed});
                    bullets.push({x: player.x - 5, y: player.y - 20, vx: -80, vy: bSpeed});
                    bullets.push({x: player.x + 5, y: player.y - 20, vx: 80, vy: bSpeed});
                    bullets.push({x: player.x + 15, y: player.y - 10, vx: 250, vy: bSpeed});
                }
            }
        }

        function updateHUD() {
            scoreUI.innerText = score; phaseUI.innerText = phase;
            livesUI.innerText = lives.toFixed(1); powerUI.innerText = firePower;
        }

        function takeDamage(amount) {
            if(isInvulnerable) return;
            lives -= amount;
            if(lives < 0) lives = 0;
            sfxDamage();
            updateHUD();
            
            if (amount >= 1) setInvulnerable(1000);
            
            if(lives <= 0) {
                gameState = 'gameover';
                hud.classList.add('hidden');
                gameOverScreen.classList.remove('hidden');
                finalScoreUI.innerText = score;
                finalPhaseUI.innerText = phase;
            }
        }

        function checkCollisions() {
            for (let i = bullets.length - 1; i >= 0; i--) {
                let b = bullets[i];
                for (let j = enemies.length - 1; j >= 0; j--) {
                    let e = enemies[j];
                    let dx = b.x - e.x, dy = b.y - e.y, dist = Math.sqrt(dx*dx + dy*dy);
                    if (dist < e.size + 5) {
                        bullets.splice(i, 1);
                        e.hp -= 1;
                        createExplosion(b.x, b.y, player.color);
                        
                        if (e.hp <= 0) {
                            score += 10;
                            sfxExplosion();
                            createExplosion(e.x, e.y, e.color);
                            if (Math.random() < 0.08) spawnPowerUp(e.x, e.y);
                            enemies.splice(j, 1);
                            
                            if (Math.floor(score / 500) > phase - 1) advancePhase();
                            updateHUD();
                        }
                        break;
                    }
                }
            }

            if (!isInvulnerable) {
                for (let j = enemies.length - 1; j >= 0; j--) {
                    let e = enemies[j];
                    let dx = player.x - e.x, dy = player.y - e.y, dist = Math.sqrt(dx*dx + dy*dy);
                    if (dist < e.size + player.size * 0.7) {
                        createExplosion(player.x, player.y, '#ff0000');
                        enemies.splice(j, 1);
                        takeDamage(1.0);
                        firePower = Math.max(1, firePower - 1);
                        updateHUD();
                    }
                }
            }

            for (let i = powerups.length - 1; i >= 0; i--) {
                let p = powerups[i];
                let dx = player.x - p.x, dy = player.y - p.y, dist = Math.sqrt(dx*dx + dy*dy);
                if (dist < p.size + player.size) {
                    if(firePower < 4) firePower++;
                    score += 50;
                    sfxPowerup();
                    updateHUD();
                    powerups.splice(i, 1);
                }
            }
        }

        function drawPlayer() {
            ctx.save(); ctx.translate(player.x, player.y);
            if (isInvulnerable) ctx.globalAlpha = (Math.sin(Date.now() / 50) + 1) / 2;
            ctx.shadowBlur = 20; ctx.shadowColor = player.color; ctx.fillStyle = player.color;
            ctx.beginPath(); ctx.moveTo(0, -player.size); ctx.lineTo(player.size, player.size);
            ctx.lineTo(0, player.size * 0.5); ctx.lineTo(-player.size, player.size);
            ctx.closePath(); ctx.fill(); ctx.restore();
        }

        function drawEnemy(e) {
            ctx.save(); ctx.translate(e.x, e.y);
            ctx.shadowBlur = 15; ctx.shadowColor = e.color; ctx.strokeStyle = e.color; ctx.lineWidth = 3;
            ctx.beginPath();
            if (e.shape === 0) {
                let sides = 6;
                for(let k=0; k<sides; k++){
                    let angle = (k * 2 * Math.PI) / sides;
                    let r = e.size * (0.8 + 0.2*Math.sin(k+Date.now()/200));
                    if(k===0) ctx.moveTo(r*Math.cos(angle), r*Math.sin(angle));
                    else ctx.lineTo(r*Math.cos(angle), r*Math.sin(angle));
                }
            } else if (e.shape === 1) {
                ctx.moveTo(0, e.size); ctx.lineTo(-e.size, -e.size); ctx.lineTo(e.size, -e.size);
            } else {
                ctx.moveTo(0, -e.size); ctx.lineTo(e.size, 0); ctx.lineTo(0, e.size); ctx.lineTo(-e.size, 0);
            }
            ctx.closePath(); ctx.stroke();
            ctx.fillStyle = '#000'; ctx.fill(); ctx.restore();
        }

        function gameLoop(now) {
            let dt = (now - lastTime) / 1000;
            if(dt > 0.1) dt = 0.1;
            lastTime = now;

            ctx.fillStyle = '#050510'; ctx.fillRect(0, 0, width, height);

            ctx.fillStyle = '#ffffff';
            for(let s of stars) {
                s.y += s.speed * dt * (gameState==='playing'?3:1);
                if(s.y > height) { s.y = 0; s.x = Math.random() * width; }
                ctx.beginPath(); ctx.arc(s.x, s.y, s.size, 0, Math.PI*2); ctx.fill();
            }

            if (gameState === 'playing') {
                player.x += (player.targetX - player.x) * 10 * dt;
                player.y += (player.targetY - player.y) * 10 * dt;
                player.x = Math.max(player.size, Math.min(width - player.size, player.x));
                player.y = Math.max(player.size, Math.min(height - player.size, player.y));

                if(invulnerableTimer > 0) {
                    invulnerableTimer -= dt * 1000;
                    if(invulnerableTimer <= 0) isInvulnerable = false;
                }

                shoot(now); spawnEnemy(now);
                
                ctx.fillStyle = '#00ffff'; ctx.shadowBlur = 10; ctx.shadowColor = '#00ffff';
                for (let i = bullets.length - 1; i >= 0; i--) {
                    let b = bullets[i]; b.x += b.vx * dt; b.y += b.vy * dt;
                    if (b.y < -20 || b.x < -20 || b.x > width+20) { bullets.splice(i, 1); continue; }
                    ctx.beginPath(); ctx.arc(b.x, b.y, 4, 0, Math.PI*2); ctx.fill();
                }

                ctx.fillStyle = '#00ff00'; ctx.shadowColor = '#00ff00'; ctx.font = '20px Orbitron';
                ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                for (let i = powerups.length - 1; i >= 0; i--) {
                    let p = powerups[i]; p.y += p.speed * dt;
                    if(p.y > height + 20) { powerups.splice(i, 1); continue; }
                    ctx.fillText('P', p.x, p.y);
                }
                ctx.shadowBlur = 0;

                for (let i = enemies.length - 1; i >= 0; i--) {
                    let e = enemies[i]; e.y += e.speed * dt;
                    if (e.y > height + e.size) { takeDamage(0.5); enemies.splice(i, 1); continue; }
                    drawEnemy(e);
                }

                for (let i = particles.length - 1; i >= 0; i--) {
                    let p = particles[i]; p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt * 2;
                    if (p.life <= 0) { particles.splice(i, 1); continue; }
                    ctx.globalAlpha = p.life; ctx.fillStyle = p.color; ctx.shadowBlur = 10; ctx.shadowColor = p.color;
                    ctx.beginPath(); ctx.arc(p.x, p.y, 3, 0, Math.PI*2); ctx.fill();
                }
                ctx.globalAlpha = 1.0; ctx.shadowBlur = 0;

                checkCollisions(); drawPlayer();
            }
            animationId = requestAnimationFrame(gameLoop);
        }

        startBtn.addEventListener('click', startGame);
        restartBtn.addEventListener('click', startGame);

        setTimeout(() => {
            intro.style.display = 'none';
            menu.classList.remove('hidden');
            gameState = 'menu';
            lastTime = performance.now();
            gameLoop(performance.now());
        }, 3500);
    </script>
</body>
</html>
